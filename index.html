<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ลอยกระทง คืนวันเพ็ญ</title><style>*{box-sizing:border-box}body{margin:0;background:#080f26;color:#fff;font:16px system-ui;text-align:center}main{max-width:850px;margin:auto;padding:15px}h1{color:#ffe3a3;font-size:26px;margin:8px}#stage{position:relative;border-radius:20px;overflow:hidden;border:1px solid #53617b}canvas{display:block;width:100%;height:min(65vh,520px);touch-action:none}#panel{position:absolute;inset:0;display:grid;place-content:center;background:#08132c88;padding:20px}button{border:0;border-radius:24px;background:#ffdc8c;color:#352314;padding:13px 24px;font:bold 17px system-ui;cursor:pointer}#hud{display:flex;justify-content:space-around;padding:14px;background:#17243c;border-radius:14px;margin:12px 0}input{padding:12px;border-radius:12px;border:0;text-align:center;font:inherit;max-width:100%;margin-bottom:12px}small{color:#aebbd1}</style><main><h1>🪷 ลอยกระทง คืนวันเพ็ญ</h1><div id="hud"><span>คะแนน <b id="score">0</b></span><span>เวลา <b id="time">30</b> วิ</span><span>สถิติ <b id="best">0</b></span></div><div id="stage"><canvas id="c" aria-label="ผิวน้ำสำหรับปล่อยกระทง"></canvas><div id="panel"><h2 id="title">สุขสันต์วันลอยกระทง</h2><p id="msg">แตะผิวน้ำเพื่อปล่อยกระทง 30 วินาที</p><input id="name" maxlength="24" placeholder="ชื่อผู้เล่น (ไม่บังคับ)"><button id="start">เริ่มเล่น</button></div></div><p>ปล่อยกระทง 1 ใบ = 10 คะแนน • ทุก 5 ใบมีพลุ!</p><button id="share">แชร์เกมให้เพื่อน</button><p><small>สถิติสูงสุดบันทึกบนเครื่องของคุณเท่านั้น</small></p></main><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');let w,h,boats=[],particles=[],score=0,active=false,deadline=0,last=0,best=0;try{best=Number(localStorage.getItem('loyBest'))||0}catch{}$('best').textContent=best;let stars=Array.from({length:65},()=>[Math.random(),Math.random()*.48]);function resize(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;w=r.width;h=r.height;c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0)}new ResizeObserver(resize).observe(c);resize();function oval(x,y,a,b,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,a,b,0,0,7);g.fill()}function fire(){let x=w*(.15+Math.random()*.7),y=h*(.1+Math.random()*.28),col=['#ffb9dc','#ffe5a0','#91ffdd'][Math.floor(Math.random()*3)];for(let i=0;i<48;i++){let a=i/48*Math.PI*2,v=35+Math.random()*75;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1.3,col})}}function draw(t){let dt=Math.min(.05,(t-last)/1000);last=t;let sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#080e28');sky.addColorStop(.53,'#53465d');sky.addColorStop(.54,'#193a54');sky.addColorStop(1,'#07182f');g.fillStyle=sky;g.fillRect(0,0,w,h);for(let s of stars)oval(s[0]*w,s[1]*h,1.2,1.2,'#fff4cc');let mx=w*.72,my=h*.19;let glow=g.createRadialGradient(mx,my,10,mx,my,85);glow.addColorStop(0,'#ffe9aa88');glow.addColorStop(1,'#ffe9aa00');g.fillStyle=glow;g.fillRect(mx-85,my-85,170,170);oval(mx,my,32,32,'#fff0bf');for(let i=0;i<16;i++)oval(i*w/15,h*.54,35,15+12*Math.sin(i*4),'#102034');for(let i=0;i<55;i++){let y=h*.56+i*h*.008,x=(i*83+Math.sin(t*.001+i)*20)%w;g.fillStyle=i%4?'#83bed133':'#ffe4a055';g.fillRect(x,y,20+i%5*8,2)}for(let i=0;i<18;i++){g.fillStyle='#ffe6a044';g.fillRect(mx-8-i*2+Math.sin(t*.002+i)*8,h*.56+i*h*.023,16+i*4,2)}for(let b of boats){b.x+=dt*12;b.y-=dt*2;g.save();g.translate(b.x,b.y+Math.sin(t*.004+b.p)*2);g.scale(b.s,b.s);oval(0,13,27,5,'#f8dc7740');oval(0,5,25,9,'#8a5e32');oval(0,0,25,8,'#25855e');for(let i=-2;i<=2;i++){g.fillStyle=i%2?'#ffbad7':'#eb76af';g.beginPath();g.moveTo(i*8-7,2);g.quadraticCurveTo(i*8-12,-12,i*8,-20+Math.abs(i)*4);g.quadraticCurveTo(i*8+12,-9,i*8+7,2);g.fill()}g.fillStyle='#fff3c5';g.fillRect(-2,-21,4,15);oval(0,-25,5,8,'#ffba46');oval(0,-24,2,4,'#fffbd4');g.restore()}boats=boats.filter(b=>b.x<w+50);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=28*dt;p.life-=dt;g.globalAlpha=Math.max(0,Math.min(1,p.life));oval(p.x,p.y,2,2,p.col)}g.globalAlpha=1;particles=particles.filter(p=>p.life>0);if(active){$('time').textContent=Math.max(0,Math.ceil((deadline-t)/1000));if(t>=deadline){active=false;best=Math.max(best,score);try{localStorage.setItem('loyBest',best)}catch{}$('best').textContent=best;$('title').textContent='สุขสันต์วันลอยกระทง!';$('msg').textContent=($('name').value.trim()||'คุณ')+' ได้ '+score+' คะแนน';$('start').textContent='เล่นอีกครั้ง';$('panel').style.display='grid'}}requestAnimationFrame(draw)}$('start').onclick=()=>{score=0;boats=[];particles=[];$('score').textContent=0;$('time').textContent=30;deadline=performance.now()+30000;active=true;$('panel').style.display='none'};c.addEventListener('pointerdown',e=>{if(!active||performance.now()>=deadline)return;let r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(y<h*.55)return;boats.push({x,y,p:Math.random()*6,s:.7+y/h*.5});score+=10;$('score').textContent=score;if(score%50===0)fire()});$('share').onclick=async()=>{if(location.protocol==='file:'){alert('นำไฟล์ขึ้นเว็บไซต์ก่อนแชร์ลิงก์');return}try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else{await navigator.clipboard.writeText(location.href);alert('คัดลอกลิงก์แล้ว')}}catch{}};requestAnimationFrame(draw);
</script></html>
